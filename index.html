<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>国庆潮港路书</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --paper: #f4efe4;
    --paper-2: #ebe4d4;
    --ink: #1d1a16;
    --muted: #6f675b;
    --line: #d6ccb8;
    --accent: #c8412e;
    --sea: #1f6f8b;
    --green: #2f7d5b;
    --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --col: min(500px, 42vw);
    --map-h: 0px;
    --nav-h: 52px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- 布局：左路书 右地图 ---------- */
  #map {
    position: fixed; top: 0; right: 0; bottom: 0;
    left: var(--col);
    background: #e9e4d8;
    border-left: 1px solid var(--line);
    z-index: 1;
  }
  .book { width: var(--col); position: relative; }

  @media (max-width: 860px) {
    :root { --col: 100%; --map-h: 42vh; }
    #map { position: sticky; top: 0; left: 0; height: var(--map-h); border-left: 0; border-bottom: 1px solid var(--line); z-index: 5; }
  }

  /* ---------- 日期导航条 ---------- */
  .daynav {
    position: sticky; top: var(--map-h); z-index: 4;
    height: var(--nav-h);
    display: flex; align-items: center; gap: 6px;
    padding: 0 16px;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    overflow-x: auto; scrollbar-width: none;
  }
  .daynav::-webkit-scrollbar { display: none; }
  .daynav a {
    flex: none;
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    padding: 5px 10px; border-radius: 999px;
    color: var(--muted); text-decoration: none;
    border: 1px solid transparent;
    transition: background 200ms, color 200ms;
  }
  .daynav a:hover { color: var(--ink); border-color: var(--line); }
  .daynav a.on { background: var(--ink); color: var(--paper); }

  /* ---------- 封面 ---------- */
  .cover { padding: 40px 28px 32px; border-bottom: 1px dashed var(--line); }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: .18em; color: var(--accent); text-transform: uppercase;
  }
  .cover h1 {
    font-family: var(--serif); font-weight: 900;
    font-size: clamp(34px, 5vw, 46px); line-height: 1.15;
    margin: 10px 0 12px;
  }
  .cover .lead { color: var(--muted); font-size: 15px; }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    margin-top: 24px;
    border: 1px solid var(--ink); border-radius: 4px;
  }
  .stats div { padding: 10px 12px; border-left: 1px solid var(--ink); }
  .stats div:first-child { border-left: 0; }
  .stats b { display: block; font-family: var(--mono); font-size: 22px; line-height: 1.2; }
  .stats span { font-size: 12px; color: var(--muted); }
  .stops {
    list-style: none; margin-top: 24px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 0;
    font-size: 14px; font-weight: 500;
  }
  .stops li { display: flex; align-items: center; }
  .stops li + li::before { content: ""; width: 18px; height: 0; border-top: 1.5px dashed var(--muted); margin: 0 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 22px; height: 0; vertical-align: middle; margin-right: 6px; border-top: 3px solid var(--accent); }
  .legend i.dash { border-top-style: dashed; border-top-color: var(--muted); }
  .legend i.sea { border-top: 3px dashed var(--sea); }
  .legend i.hike { border-top: 3px dotted var(--green); }

  /* ---------- 每日 ---------- */
  .day { padding: 30px 28px 34px; border-bottom: 1px dashed var(--line); scroll-margin-top: calc(var(--map-h) + var(--nav-h)); }
  .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .stage {
    font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .12em;
    color: var(--paper); background: var(--accent);
    padding: 3px 8px; border-radius: 3px;
  }
  .date { font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: -.02em; }
  .date small { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .day h2 { font-family: var(--serif); font-weight: 900; font-size: 28px; line-height: 1.25; margin: 14px 0 6px; }
  .day .lead { color: var(--muted); font-size: 15px; }
  .leg {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
    margin-top: 12px; padding: 8px 12px;
    background: var(--paper-2); border-radius: 4px;
    font-size: 13px; font-weight: 500;
  }
  .leg .arr { font-family: var(--mono); color: var(--accent); font-size: 12px; }

  /* ---------- 天气 ---------- */
  .wx { margin-top: 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff6; }
  .wx-row {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center;
    padding: 10px 12px; border-top: 1px solid var(--line);
  }
  .wx-row:first-child { border-top: 0; }
  .wx-ico { font-size: 30px; line-height: 1; grid-row: span 2; }
  .wx-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 14px; font-weight: 700; }
  .wx-main .t { font-family: var(--mono); font-size: 16px; }
  .wx-main .t i { font-style: normal; color: var(--sea); }
  .wx-main .t em { font-style: normal; color: var(--accent); }
  .wx-main .d { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 700; }
  .wx-sub { font-size: 12px; color: var(--muted); }
  .wx-sub .rain { color: var(--sea); font-weight: 700; }
  .wx-msg { padding: 10px 12px; font-size: 12px; color: var(--muted); }
  .wx-src { padding: 0 12px 8px; font-size: 11px; color: var(--muted); }

  .block-title {
    margin: 22px 0 10px;
    font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .16em;
    color: var(--muted); text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .block-title::after { content: ""; flex: 1; border-top: 1px solid var(--line); }

  .steps { list-style: none; }
  .steps li {
    display: grid; grid-template-columns: 52px 1fr; gap: 10px;
    padding: 9px 0; border-top: 1px solid var(--line);
    font-size: 15px;
  }
  .steps li:first-child { border-top: 0; }
  .steps .time { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); padding-top: 3px; }
  .steps b { font-weight: 700; }
  .pin {
    display: inline-flex; align-items: center; gap: 4px;
    margin: 0 2px; padding: 0 6px 0 2px;
    border-radius: 999px; border: 1px solid var(--line);
    background: #fff8; font-weight: 700; line-height: 1.6;
    transition: border-color 150ms, background 150ms;
  }
  .pin:hover { border-color: var(--accent); background: #fff; }
  .pin .n {
    display: inline-grid; place-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-family: var(--mono); font-size: 10px;
  }
  .pin.hotel .n { background: var(--ink); }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff6; }
  .tip {
    margin-top: 14px; padding: 10px 12px;
    font-size: 14px; line-height: 1.65;
    border-left: 3px solid var(--accent); background: #fff7;
  }
  .tip strong { color: var(--accent); margin-right: 6px; }

  .stay {
    margin-top: 20px; display: flex; align-items: center; gap: 14px;
    padding: 12px 14px; border: 1.5px solid var(--ink); border-radius: 4px;
    width: 100%; text-align: left;
    transition: background 150ms;
  }
  .stay:hover { background: #fff8; }
  .stay .ico {
    flex: none; width: 34px; height: 34px; border-radius: 4px;
    display: grid; place-content: center;
    background: var(--ink); color: var(--paper);
    font-family: var(--serif); font-weight: 900;
  }
  .stay .h { font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.3; }
  .stay .s { font-size: 12px; color: var(--muted); }

  /* ---------- 清单 ---------- */
  .check { list-style: none; display: grid; gap: 2px; }
  .check label { display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; cursor: pointer; font-size: 15px; }
  .check input {
    appearance: none; flex: none; width: 18px; height: 18px; margin-top: 3px;
    border: 1.5px solid var(--ink); border-radius: 3px; display: grid; place-content: center; cursor: pointer;
  }
  .check input::after { content: "✓"; font-size: 13px; font-weight: 700; color: var(--paper); transform: scale(0); transition: transform 150ms; }
  .check input:checked { background: var(--accent); border-color: var(--accent); }
  .check input:checked::after { transform: scale(1); }
  .check input:checked + span { color: var(--muted); text-decoration: line-through; }
  .progress-line { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 10px; }

  .foot { padding: 24px 28px 60px; font-size: 12px; color: var(--muted); }

  /* ---------- 地图元素 ---------- */
  .map-btns { position: absolute; z-index: 800; top: 12px; right: 12px; display: flex; gap: 6px; }
  .map-btns button {
    background: var(--paper); border: 1px solid var(--ink); border-radius: 4px;
    padding: 4px 10px; font-size: 12px; font-weight: 700;
    box-shadow: 0 2px 0 var(--ink);
  }
  .map-btns button:active { transform: translateY(2px); box-shadow: none; }
  .map-btns button.on { background: var(--ink); color: var(--paper); }

  .mk {
    width: 26px; height: 26px; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    background: var(--accent); border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
    display: grid; place-content: center;
    transition: opacity 250ms;
  }
  .mk b { transform: rotate(45deg); color: #fff; font-family: var(--mono); font-size: 11px; }
  .mk-wrap.off { display: none; }
  .mk-wrap.dim .mk { width: 12px; height: 12px; border-width: 1.5px; margin: 7px; opacity: .7; }
  .mk-wrap.dim .mk b { display: none; }

  .ht {
    width: 28px; height: 28px; border-radius: 4px;
    background: var(--ink); color: var(--paper); border: 2px solid #fff;
    display: grid; place-content: center;
    font-family: var(--serif); font-weight: 900; font-size: 13px;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
    transition: transform 200ms;
  }
  .ht-wrap.dim .ht { transform: scale(.7); opacity: .6; }

  .city {
    white-space: nowrap; transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--serif); font-weight: 900; font-size: 14px;
    color: var(--ink);
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 6px #fff;
  }
  .city::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--ink); }
  .leaflet-container.zoomed .city { display: none; }

  .leaflet-container { font-family: var(--sans); }
  .leaflet-popup-content-wrapper { border-radius: 4px; }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.55; }
  .pop-t { font-family: var(--serif); font-weight: 900; font-size: 15px; }
  .pop-d { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .pop-a { display: inline-block; margin-top: 6px; color: var(--accent); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>

<div id="map" aria-label="行程地图"></div>

<div class="book">
  <nav class="daynav" id="daynav" aria-label="按天跳转"></nav>

  <header class="cover" id="d0" data-day="0">
    <div class="eyebrow">Roadbook · 2026 国庆</div>
    <h1>潮州 · 惠州 · 香港</h1>
    <p class="lead">从古城牌坊到维港夜色，一路向南：看海、吃茶、上岛。往下滚动，地图会跟着每天的行程走。</p>
    <div class="stats">
      <div><b>8</b><span>天 7 晚</span></div>
      <div><b>4</b><span>座城市</span></div>
      <div><b>3</b><span>家酒店</span></div>
      <div><b>1</b><span>座离岛</span></div>
    </div>
    <ol class="stops">
      <li>上海</li><li>揭阳</li><li>潮州</li><li>惠州</li><li>香港</li><li>深圳</li><li>上海</li>
    </ol>
    <div class="legend">
      <span><i></i>陆路 / 高铁</span>
      <span><i class="dash"></i>长途（交通方式待定）</span>
      <span><i class="sea"></i>渡轮</span>
      <span><i class="hike"></i>徒步</span>
    </div>
  </header>

  <main id="days"></main>

  <section class="day" id="d8" data-day="8">
    <div class="day-head"><span class="stage">CHECKLIST</span></div>
    <h2>出发前再看一眼</h2>
    <p class="lead">勾选状态会保存在这台设备的浏览器里。</p>
    <ul class="check" id="checklist">
      <li><label><input type="checkbox"><span>港澳通行证 + 有效签注</span></label></li>
      <li><label><input type="checkbox"><span>身份证</span></label></li>
      <li><label><input type="checkbox"><span>9/30 上海 → 揭阳 票</span></label></li>
      <li><label><input type="checkbox"><span>10/1 潮州 → 惠州 21:00 交通</span></label></li>
      <li><label><input type="checkbox"><span>10/3 惠州 → 香港 高铁票</span></label></li>
      <li><label><input type="checkbox"><span>10/7 深圳 → 上海 票</span></label></li>
      <li><label><input type="checkbox"><span>香港故宫门票预约（10/5）</span></label></li>
      <li><label><input type="checkbox"><span>八达通 / 支付方式 · 香港流量</span></label></li>
      <li><label><input type="checkbox"><span>转换插头（香港英标三脚）</span></label></li>
      <li><label><input type="checkbox"><span>防晒、雨具、好走的鞋</span></label></li>
    </ul>
    <div class="progress-line" id="checkProgress"></div>
  </section>

  <footer class="foot">地图上的酒店和景点位置为大致坐标，实际出行请以地图 App 导航为准。底图 © 高德地图。</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============ 数据 ============ */
// 坐标为 WGS84 [lat, lng]，渲染时转换为高德使用的 GCJ-02
const P = {
  sh:       { n: '上海', ll: [31.2304, 121.4737] },
  jy:       { n: '揭阳', ll: [23.5497, 116.3727] },
  sz:       { n: '深圳', ll: [22.5431, 114.0579] },

  czHotel:  { n: '潮州古城亚朵酒店', ll: [23.6618, 116.6405], hotel: true },
  pfj:      { n: '牌坊街', ll: [23.6640, 116.6430] },
  gjq:      { n: '广济桥', ll: [23.6617, 116.6505] },
  kys:      { n: '开元寺', ll: [23.6650, 116.6455] },
  hwg:      { n: '韩文公祠', ll: [23.6585, 116.6575] },

  hzHotel:  { n: '惠州金山湖港惠轻居亚朵酒店', ll: [23.0660, 114.4120], hotel: true },
  xh:       { n: '惠州西湖 · 苏堤', ll: [23.1075, 114.3985] },
  szt:      { n: '泗洲塔', ll: [23.1030, 114.3975] },
  dpc:      { n: '东坡祠', ll: [23.1066, 114.4027] },
  sdj:      { n: '水东街', ll: [23.1128, 114.4170] },
  jsh:      { n: '金山湖', ll: [23.0600, 114.4150] },

  xjl:      { n: '香港西九龙站', ll: [22.3043, 114.1650] },
  hkHotel:  { n: '都会海逸酒店', ll: [22.3037, 114.1830], hotel: true },
  ch:       { n: '港铁彩虹站', ll: [22.3349, 114.2090] },
  sk:       { n: '西贡海滨长廊 · 码头', ll: [22.3818, 114.2740] },
  c4:       { n: '中环 4 号码头', ll: [22.2873, 114.1610] },
  ysw:      { n: '榕树湾', ll: [22.2270, 114.1100] },
  hsy:      { n: '洪圣爷湾泳滩', ll: [22.2225, 114.1085] },
  jlj:      { n: '家乐径', ll: [22.2150, 114.1200] },
  sgw:      { n: '索罟湾', ll: [22.2045, 114.1340] },
  gg:       { n: '香港故宫文化博物馆', ll: [22.3016, 114.1575] },
  tst:      { n: '尖沙咀海滨 · 星光大道', ll: [22.2937, 114.1745] },
  star:     { n: '天星小轮（尖沙咀码头）', ll: [22.2940, 114.1685] },
  zh:       { n: '中环 · 上环', ll: [22.2840, 114.1540] },
  peak:     { n: '太平山顶', ll: [22.2713, 114.1498] },
  mk:       { n: '旺角', ll: [22.3190, 114.1700] },
};

const CITIES = [
  { n: '上海', ll: P.sh.ll }, { n: '揭阳', ll: P.jy.ll }, { n: '潮州', ll: [23.6700, 116.6300] },
  { n: '惠州', ll: [23.0900, 114.4100] }, { n: '香港', ll: [22.3200, 114.1700] }, { n: '深圳', ll: P.sz.ll },
];

// type: road 陆路 / long 长途待定 / ferry 渡轮 / hike 徒步
const LEGS = [
  { day: 1, type: 'long', pts: ['sh', 'jy'], arc: .18 },
  { day: 1, type: 'road', pts: ['jy', 'czHotel'] },
  { day: 2, type: 'road', pts: ['czHotel', 'hzHotel'] },
  { day: 4, type: 'road', pts: ['hzHotel', 'xjl'] },
  { day: 4, type: 'road', pts: ['xjl', 'hkHotel', 'ch', 'sk'] },
  { day: 5, type: 'ferry', pts: ['c4', 'ysw'] },
  { day: 5, type: 'hike', pts: ['ysw', 'hsy', 'jlj', 'sgw'] },
  { day: 5, type: 'ferry', pts: ['sgw', 'c4'] },
  { day: 7, type: 'road', pts: ['hkHotel', 'sz'] },
  { day: 7, type: 'long', pts: ['sz', 'sh'], arc: -.18 },
];

// 文本中的 {key} 或 {key|显示文字} 会渲染为可点击的地图标记
const DAYS = [
  {
    wx: 'cz', date: '9/30', wd: '周三', title: '出发，去潮州',
    leg: ['上海', '揭阳', '潮州古城'],
    steps: [
      ['出发', '<b>上海出发</b>，前往 {jy}'],
      ['抵达', '揭阳转车去潮州古城（车程约 1 小时）'],
      ['晚上', '入住放行李，去 {pfj} 随便走走、吃宵夜'],
    ],
    stay: { p: 'czHotel', s: '住 1 晚 · 9/30' },
    focus: ['jy', 'czHotel', 'pfj'],
  },
  {
    wx: 'cz', date: '10/1', wd: '周四 · 国庆', title: '潮州古城一整天',
    lead: '白天逛古城，吃够潮汕味，晚上夜行去惠州。',
    leg: ['潮州古城', '21:00 出发', '惠州'],
    steps: [
      ['上午', '趁人少先去 {gjq}，再到 {kys}'],
      ['下午', '过江去 {hwg}，回来逛 {pfj}'],
      ['傍晚', '收拾行李、退房寄存'],

/* ============ 坐标转换 WGS84 → GCJ-02 ============ */
const PI = Math.PI, A = 6378245, EE = 0.00669342162296594323;
function tLat(x, y) {
  let r = -100 + 2 * x + 3 * y + .2 * y * y + .1 * x * y + .2 * Math.sqrt(Math.abs(x));
  r += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
  r += (20 * Math.sin(y * PI) + 40 * Math.sin(y / 3 * PI)) * 2 / 3;
  r += (160 * Math.sin(y / 12 * PI) + 320 * Math.sin(y * PI / 30)) * 2 / 3;
  return r;
}
function tLng(x, y) {
  let r = 300 + x + 2 * y + .1 * x * x + .1 * x * y + .1 * Math.sqrt(Math.abs(x));
  r += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
  r += (20 * Math.sin(x * PI) + 40 * Math.sin(x / 3 * PI)) * 2 / 3;
  r += (150 * Math.sin(x / 12 * PI) + 300 * Math.sin(x / 30 * PI)) * 2 / 3;
  return r;
}
// 高德在香港不做偏移
const inHK = ([lat, lng]) => lat > 22.15 && lat < 22.5 && lng > 113.83 && lng < 114.45;
function gcj(ll) {
  if (inHK(ll)) return ll;
  const [lat, lng] = ll;
  let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  const rad = lat / 180 * PI;
  let m = Math.sin(rad); m = 1 - EE * m * m;
  const s = Math.sqrt(m);
  dLat = dLat * 180 / ((A * (1 - EE)) / (m * s) * PI);
  dLng = dLng * 180 / (A / s * Math.cos(rad) * PI);
  return [lat + dLat, lng + dLng];
}

// 曲线弧（长途段）
function arc(a, b, bend) {
  const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const ctrl = [mid[0] - (b[1] - a[1]) * bend, mid[1] + (b[0] - a[0]) * bend];
  const out = [];
  for (let t = 0; t <= 1.0001; t += 1 / 40) {
    const u = 1 - t;
    out.push([u * u * a[0] + 2 * u * t * ctrl[0] + t * t * b[0], u * u * a[1] + 2 * u * t * ctrl[1] + t * t * b[1]]);
  }
  return out;
}
const LEG_STYLE = {
  road:  { color: '#c8412e', weight: 4 },
  long:  { color: '#6f675b', weight: 3, dashArray: '8 8' },

  hike:  { color: '#2f7d5b', weight: 4, dashArray: '2 8', lineCap: 'round' },
};
const legLayers = LEGS.map(l => {
  const pts = l.pts.map(pos);
  const line = L.polyline(l.arc ? arc(pts[0], pts[1], l.arc) : pts, { ...LEG_STYLE[l.type], interactive: false }).addTo(map);
  return { day: l.day, line };
});

const isMobile = () => matchMedia('(max-width: 860px)').matches;
const fitOpts = () => isMobile()
  ? { paddingTopLeft: [30, 56], paddingBottomRight: [50, 30], maxZoom: 15, duration: 1.1 }
  : { paddingTopLeft: [70, 70], paddingBottomRight: [70, 70], maxZoom: 15, duration: 1.1 };

let activeDay = -1;
function showDay(day, force) {
  if (day === activeDay && !force) return;
  activeDay = day;
  const overview = day === 0 || day === 8;
  const d = DAYS[day - 1];

  dayMarkers.forEach(({ day: md, m }) => {
    const el = m.getElement(); if (!el) return;
    el.classList.toggle('off', md !== day);
    m.setZIndexOffset(md === day ? 1000 : 0);
  });
  for (const k in hotelMarkers) {
    const el = hotelMarkers[k].getElement();
    if (el) el.classList.toggle('dim', !overview && !(d && (d.stay?.p === k || d.focus.includes(k))));
  }
  legLayers.forEach(({ day: ld, line }) => line.setStyle({ opacity: overview || ld === day ? .95 : .25 }));

  map.closePopup();
  const b = overview ? allBounds() : L.latLngBounds(d.focus.map(pos));
  if (map._loaded) map.flyToBounds(b, fitOpts());
  else map.fitBounds(b, fitOpts());

  daynav.querySelectorAll('a').forEach(a => a.classList.toggle('on', +a.dataset.day === day));
  const on = daynav.querySelector('a.on');
  if (on) daynav.scrollTo({ left: on.offsetLeft - daynav.clientWidth / 2 + on.clientWidth / 2, behavior: 'smooth' });
}

function goToDay(day) {
  const el = document.getElementById('d' + day);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });

const sections = [...document.querySelectorAll('[data-day]')].filter(el => el.tagName !== 'A');
let ticking = false;
function onScroll() {
  if (ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const probe = isMobile() ? innerHeight * .42 + 52 + 80 : innerHeight * .3;
    let cur = 0;
    for (const s of sections) if (s.getBoundingClientRect().top <= probe) cur = +s.dataset.day;
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = 8;
    showDay(cur);
  });
}
addEventListener('scroll', onScroll, { passive: true });

const WX_CITIES = {
  cz: { n: '潮州', ll: [23.66, 116.64] },

const YEAR = 2026;
const isoOf = md => { const [m, d] = md.split('/'); return `${YEAR}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`; };
function daysOf(d) {
  const out = [isoOf(d.date)];
  if (d.dateTo) {
    const cur = new Date(out[0] + 'T00:00:00Z'), end = new Date(isoOf(d.dateTo) + 'T00:00:00Z');
    while (cur < end) { cur.setUTCDate(cur.getUTCDate() + 1); out.push(cur.toISOString().slice(0, 10)); }
  }
  return out;
}
// WMO weather code → [图标, 描述]
function wmo(c) {
  if (c === 0) return ['☀️', '晴'];
  if (c === 1) return ['🌤️', '大部晴朗'];
  if (c === 2) return ['⛅', '多云'];
  if (c === 3) return ['☁️', '阴'];
  if (c === 45 || c === 48) return ['🌫️', '有雾'];
  if (c >= 51 && c <= 57) return ['🌦️', '毛毛雨'];
  if (c === 61 || c === 80) return ['🌦️', '小雨'];
  if (c === 63 || c === 81) return ['🌧️', '中雨'];
  if (c === 65 || c === 82) return ['🌧️', '大雨'];
  if (c === 66 || c === 67) return ['🌧️', '冻雨'];
  if (c >= 71 && c <= 77) return ['❄️', '雪'];
  if (c === 85 || c === 86) return ['❄️', '阵雪'];
  if (c === 95) return ['⛈️', '雷阵雨'];
  if (c === 96 || c === 99) return ['⛈️', '强雷暴'];
  return ['🌡️', '未知'];
}
const WX_CACHE = 'trip101-weather';
async function loadCity(key) {
  const { ll: [lat, lon] } = WX_CITIES[key];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,uv_index_max` +
    `&timezone=Asia%2FShanghai&forecast_days=16`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).daily;
}
function wxRow(date, i, city, cd, stale) {
  if (i < 0) return `<div class="wx-row"><div class="wx-ico">🕓</div><div class="wx-main"><span>${date.slice(5).replace('-', '/')}</span></div><div class="wx-sub">暂无预报（预报最多提前 16 天，出发前会自动更新）</div></div>`;
  const [ico, txt] = wmo(cd.weather_code[i]);
  const p = cd.precipitation_probability_max[i], mm = cd.precipitation_sum[i];
  const wet = p >= 50 || mm >= 5;
  return `<div class="wx-row">
    <div class="wx-ico">${ico}</div>
    <div class="wx-main"><span>${txt}</span><span class="t"><i>${Math.round(cd.temperature_2m_min[i])}°</i> / <em>${Math.round(cd.temperature_2m_max[i])}°</em></span><span class="d">${city} · ${date.slice(5).replace('-', '/')}</span></div>
    <div class="wx-sub">${wet ? '<span class="rain">☂ 记得带伞</span> · ' : ''}降水概率 ${p ?? '–'}% · 风 ${Math.round(cd.wind_speed_10m_max[i])} km/h · 紫外线 ${Math.round(cd.uv_index_max[i])}</div>
  </div>`;
}
async function initWeather() {
  const need = [...new Set(DAYS.map(d => d.wx))];
  const data = {}; let stale = false;
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(WX_CACHE)) || {}; } catch {}
  await Promise.all(need.map(async k => {
    try { data[k] = await loadCity(k); cache[k] = data[k]; }
    catch { if (cache[k]) { data[k] = cache[k]; stale = true; } }
  }));
  try { localStorage.setItem(WX_CACHE, JSON.stringify(cache)); } catch {}
  DAYS.forEach((d, n) => {
    const box = document.querySelector(`[data-wx="${n}"]`); if (!box) return;
    const cd = data[d.wx];
    if (!cd) { box.innerHTML = '<div class="wx-msg">天气暂时无法获取，请检查网络后刷新。</div>'; return; }
    const city = WX_CITIES[d.wx].n;
    box.innerHTML = daysOf(d).map(date => wxRow(date, cd.time.indexOf(date), city, cd)).join('') +
      `<div class="wx-src">数据来自 Open-Meteo${stale ? ' · 当前离线，显示的是上次缓存' : ''}</div>`;
  });
}
initWeather();

/* ============ 清单 ============ */
const KEY = 'trip101-checklist';
const boxes = [...document.querySelectorAll('#checklist input')];
let saved = [];
try { saved = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}
boxes.forEach((b, i) => { b.checked = !!saved[i]; });
function updateCheck() {
  const n = boxes.filter(b => b.checked).length;
  document.getElementById('checkProgress').textContent = `${n} / ${boxes.length} 已完成${n === boxes.length ? ' · 可以出发了 ✈' : ''}`;
  try { localStorage.setItem(KEY, JSON.stringify(boxes.map(b => b.checked))); } catch {}
}
boxes.forEach(b => b.addEventListener('change', updateCheck));
updateCheck();
</script>
</body>
